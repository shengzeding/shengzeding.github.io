# Site configuration
title: "Shengze Ding"
description: "Academic personal website"
url: "https://shengzeding.github.io"
baseurl: ""
locale: "en-US"

# Site Author
author:
  name: "Shengze Ding <br> 丁圣泽"
  avatar: "avatar-new.jpg"
  bio: "PhD Student @ Cornell"
  location: "Ithaca, NY"
  email: "sd2332@cornell.edu"
  linkedin: "shengze-ding"

# Build settings
markdown: kramdown
remote_theme: academicpages/academicpages.github.io
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Footer settings
footer:
  links: []

# Atom Feed
atom_feed:
  hide: true

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfile
  - gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
