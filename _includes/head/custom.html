<!-- start custom head snippets -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
  :root {
    --primary-color: #2c7873;
    --accent-color: #5eb3a6;
  }

  /* 全局衬线体 */
  body, p, li, span, div {
    font-family: 'Source Serif 4', serif !important;
  }

  /* 强制所有标题 (Section Names) 应用衬线体 */
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Source Serif 4', serif !important;
    font-weight: 700 !important;
  }

  /* 粗体部分强制应用衬线体 */
  strong, b {
    font-family: 'Source Serif 4', serif !important;
    font-weight: 700 !important;
  }

  /* 左上角标题手写体 */
  html {
    border-top: 4px solid #b31b1b;
  }
  
  .masthead {
    border-bottom: 1px solid #ece8e4;
  }
  
  .masthead__menu-item--lg a,
  .masthead__menu-item--lg,
  .site-title a,
  .site-title {
    font-family: 'Lora', Georgia, serif !important;
    color: #373332 !important;
    font-size: 1.25em !important;
    font-style: italic;
    font-weight: 500 !important;
    letter-spacing: -0.025em;
    text-decoration: none !important;
  }
  
  .masthead__menu-item--lg a:hover {
    color: #b31b1b !important;
  }

  .masthead__menu-item--lg a::before,
  .masthead__menu-item--lg a::after {
    display: none !important;
  }

  /* 针对移动端微调标题大小 */
  @media (max-width: 768px) {
    .masthead__menu-item--lg a {
      font-size: 1.2em !important;
    }
  }

  /* Smooth transitions - 保留平滑过渡效果 */
  body, a, h1, h2, h3, h4, h5, h6, code, pre {
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* 侧边栏极简图标样式 */
  .author__urls i {
    color: #999 !important; /* 平时颜色较淡 */
    transition: color 0.3s ease !important;
    margin-right: 8px;
    width: 1.25em;
    text-align: center;
  }

  .author__urls a:hover i {
    color: var(--accent-color) !important; /* 悬停时变色 */
  }
</style>

<style>
  /* 移除头像的圆形裁剪、边框和阴影 */
  .author__avatar img {
    border-radius: 0 !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
  }

  .author__avatar {
    border-radius: 0 !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    background-color: transparent !important;
  }

  /* 在侧边栏姓名上方增加间距 */
  .author__content {
    margin-top: 20px !important;
  }
</style>

<style>
  /* Cornell 元素只保留页面顶端细线 */
  html {
    border-top: 3px solid #b31b1b;
  }

  /* 标题栏保持安静 */
  .masthead {
    border-bottom: 1px solid #eeeeec;
  }

  .masthead__inner-wrap {
    padding-top: 0.65em;
    padding-bottom: 0.65em;
  }

  .masthead__menu-item--lg,
  .masthead__menu-item--lg a,
  .site-title,
  .site-title a {
    font-family: 'Lora', Georgia, serif !important;
    color: #343130 !important;
    font-size: 1.15em !important;
    font-style: normal;
    font-weight: 500 !important;
    letter-spacing: -0.025em;
    text-decoration: none !important;
    border-bottom: 0 !important;
    box-shadow: none !important;
  }

  /* 去掉名字下面那条很重的黑线 */
  .masthead__menu-item--lg::before,
  .masthead__menu-item--lg::after,
  .masthead__menu-item--lg a::before,
  .masthead__menu-item--lg a::after {
    display: none !important;
    content: none !important;
  }

  .masthead__menu-item--lg a:hover {
    color: #b31b1b !important;
  }

  /* 正文略微收窄 */
  .page__inner-wrap {
    max-width: 780px;
  }

  .page__content {
    color: #4b4948;
    font-size: 1rem;
    line-height: 1.68;
    letter-spacing: 0;
  }

  .page__content p {
    margin-bottom: 1.35em;
  }

  .page__content strong {
    color: #363332;
    font-weight: 600 !important;
  }

  /* 左侧恢复开放式布局 */
  .author-card {
    padding: 0;
    background: transparent;
    border: 0;
  }

  /* 照片只增加非常轻的质感 */
  .author-card .author__avatar {
    margin-bottom: 1rem;
  }

  .author-card .author__avatar img {
    padding: 0 !important;
    border: 0 !important;
    border-radius: 3px !important;
    box-shadow: 0 10px 28px rgba(35, 29, 27, 0.09) !important;
  }

  /* 用短红线连接 Cornell 元素 */
  .author-card .author__content {
    position: relative;
    margin-top: 0 !important;
    padding-top: 0.85rem;
  }

  .author-card .author__content::before {
    position: absolute;
    top: 0;
    left: 0;
    width: 28px;
    height: 2px;
    content: "";
    background: #b31b1b;
  }

  .author-card .author__name {
    margin-bottom: 0.4rem;
    color: #302e2d;
    font-weight: 600 !important;
    line-height: 1.15;
  }

  .author-card .author__bio {
    margin-top: 0.55rem;
    color: #696462;
    font-size: 0.92rem;
  }

  .author-card .author__urls {
    margin-top: 0.8rem;
    padding-top: 0;
    border: 0;
  }

  .author-card .author__urls i {
    color: #999593 !important;
  }

  .author-card .author__urls a:hover,
  .author-card .author__urls a:hover i {
    color: #b31b1b !important;
  }
</style>


<!-- end custom head snippets -->
